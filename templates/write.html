<!DOCTYPE html>
<html lang="pl">
<head><meta charset="UTF-8"><title>Pisanie</title></head>
<body style="font-family: sans-serif; padding: 20px; max-width: 900px; margin: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin:0;">{{ essay.title }}</h2>
        <button onclick="finishWork()" style="background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer;">Zakończ i wróć na pulpit</button>
    </div>

    <div style="background: #f4f4f4; padding: 15px; border-radius: 5px; margin-bottom: 20px; font-style: italic;">{{ essay.topic_full }}</div>
    
    <div style="margin-bottom: 10px; display: flex; gap: 20px;">
        <span>Czas: <span id="timer">00:00</span></span>
        <span>Słowa: <span id="word-count">0</span></span>
    </div>

    <textarea id="editor" style="width: 100%; height: 500px; padding: 15px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc;">{{ essay.content }}</textarea>
    <p id="status" style="color: green; font-size: 0.8em;"></p>

    <script>
        let seconds = {{ essay.time_spent }};
        const editor = document.getElementById('editor');
        const timerText = document.getElementById('timer');
        const wordCount = document.getElementById('word-count');

        function updateStats() {
            const words = editor.value.trim() ? editor.value.trim().split(/\s+/).length : 0;
            wordCount.innerText = words;
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            timerText.innerText = m + ":" + s;
        }

        setInterval(() => { seconds++; updateStats(); }, 1000);
        
        function save(isDone = false) {
            fetch('/api/save/{{ essay.id }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: editor.value, time_spent: seconds, is_completed: isDone })
            }).then(() => {
                document.getElementById('status').innerText = "Zapisano o " + new Date().toLocaleTimeString();
                if(isDone) window.location.href = "/student/{{ essay.student.url_slug }}";
            });
        }

        setInterval(() => save(false), 15000);
        function finishWork() { if(confirm("Zakończyć pracę?")) save(true); }
        updateStats();
    </script>
</body>
</html>
