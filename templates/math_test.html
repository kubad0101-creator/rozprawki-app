<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Test</title>
    <style>
        :root { --bg: #f4f6f9; --box-bg: #fff; --text: #333; --border: #ccc; }
        .dark-mode { --bg: #1e1e1e; --box-bg: #2d2d2d; --text: #f0f0f0; --border: #555; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 30px; max-width: 800px; margin: auto; transition: 0.3s; }
        .question-box { background: var(--box-bg); padding: 20px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; }
        .options label { display: block; margin: 10px 0; cursor: pointer; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 5px; }
        .options label:hover { background: rgba(0,0,0,0.1); }
        .btn-submit { background: #001f5b; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .theme-toggle { position: absolute; top: 20px; right: 20px; background: none; border: 1px solid var(--border); color: var(--text); padding: 8px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="document.body.classList.toggle('dark-mode')">🌓 Tryb</button>
    <div style="text-align: center; margin-bottom: 30px;">
        <img src="{{ url_for('static', filename='logo_openuk.jpg') }}" alt="Logo" style="height: 50px;">
        <h1 style="color: #001f5b;">Math Test</h1>
    </div>

    <form id="mathForm">
        {% for q in questions %}
        <div class="question-box">
            <strong>{{ loop.index }}. {{ q.text }}</strong>
            <div class="options">
                <label><input type="radio" name="{{ q.id }}" value="a"> a) {{ q.options.a }}</label>
                <label><input type="radio" name="{{ q.id }}" value="b"> b) {{ q.options.b }}</label>
                <label><input type="radio" name="{{ q.id }}" value="c"> c) {{ q.options.c }}</label>
                <label><input type="radio" name="{{ q.id }}" value="d"> d) {{ q.options.d }}</label>
            </div>
        </div>
        {% endfor %}
        <button type="button" class="btn-submit" onclick="submitMath()">Zakończ Test</button>
    </form>

    <script>
        function submitMath() {
            let data = {};
            let formData = new FormData(document.getElementById('mathForm'));
            for(let [key, val] of formData.entries()) { data[key] = val; }
            
            fetch('/api/math/submit/{{ student.id }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(r => r.json()).then(res => {
                alert("Twój wynik to: " + res.score + " / {{ questions|length }}");
                window.location.href = "/student/{{ student.url_slug }}";
            });
        }
    </script>
</body>
</html>
