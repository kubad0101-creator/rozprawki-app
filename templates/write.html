<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pisanie: {{ essay.title }}</title>
</head>
<body style="font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto;">
    <h2>{{ essay.title }}</h2>
    
    <div style="margin-bottom: 10px; background: #f0f0f0; padding: 10px; border-radius: 5px;">
        <strong>Czas:</strong> <span id="timer">00:00</span> | 
        <strong>Liczba słów:</strong> <span id="word-count">0</span>
    </div>

    <textarea id="editor" style="width: 100%; height: 400px; padding: 10px; font-family: monospace; font-size: 14px;" placeholder="Zacznij pisać tutaj...">{{ essay.content }}</textarea>
    <p id="save-status" style="color: green; font-size: 0.9em;"></p>

    <script>
        const editor = document.getElementById('editor');
        const wordCount = document.getElementById('word-count');
        const saveStatus = document.getElementById('save-status');
        const timerDisplay = document.getElementById('timer');
        const essayId = {{ essay.id }};
        
        let seconds = 0;

        function updateWordCount() {
            const text = editor.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            wordCount.innerText = words;
        }

        // Inicjalizacja licznika na start
        updateWordCount();

        editor.addEventListener('input', updateWordCount);

        setInterval(() => {
            seconds++;
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;
        }, 1000);

        setInterval(() => {
            const content = editor.value;
            fetch(`/api/save/${essayId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            })
            .then(response => response.json())
            .then(data => {
                let now = new Date();
                saveStatus.innerText = "Zapisano: " + now.toLocaleTimeString();
            });
        }, 15000);
    </script>
</body>
</html>
